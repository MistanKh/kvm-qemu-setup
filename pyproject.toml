[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "kvm-setup-tui"
version = "0.1.0"
description = "Cross-distro KVM/QEMU host setup with a colorful Textual TUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Mistan Khomdram" }
]
dependencies = [
  "textual>=0.61.0",
  "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.1",
  "ruff>=0.4.0",
]

[project.scripts]
kvm-setup-tui = "kvm_setup_tui.cli:main"
kvm-setup-audit = "kvm_setup_tui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kvm_setup_tui"]

[tool.ruff]
line-length = 100
target-version = "py310"
